<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS Map</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: calc(100vh - 56px);
            margin: 0;
            padding: 0;
        }

        .leaflet-control-scale-line {
            font-size: 13px !important;
            padding: 2px 6px !important;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Flores Timur</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="https://sv.ugm.ac.id/" target="_blank" rel="noopener noreferrer"><i
                                class="bi bi-link-45deg"></i> SV UGM</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#aboutModal">
                            <i class="bi bi-info-circle"></i> About
                        </a>
                    </li>
                </ul>
                <form class="d-flex" role="search" id="searchForm">
                    <input class="form-control me-2" type="search" placeholder="Cari nama lokasi / wilayah..."
                        id="searchInput" list="searchDatalist" aria-label="Search" />
                    <datalist id="searchDatalist"></datalist>
                    <button class="btn btn-outline-success" type="submit"><i class="bi bi-search"></i> Search</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Modal About -->
    <div class="modal fade" id="aboutModal" tabindex="-1" aria-labelledby="aboutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="aboutModalLabel"><i class="bi bi-info-circle"></i> About</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-striped table-bordered">
                        <tr>
                            <th scope="row">Nama</th>
                            <td>Danish Eshan H</td>
                        </tr>
                        <tr>
                            <th scope="row">NIM</th>
                            <td>25/568772/SV/27529</td>
                        </tr>
                        <tr>
                            <th scope="row">Kelas</th>
                            <td>B</td>
                        </tr>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Jumlah Penduduk -->
    <div class="modal fade" id="pendudukModal" tabindex="-1" aria-labelledby="pendudukModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="pendudukModalLabel"><i class="bi bi-people-fill"></i> Data Penduduk
                    </h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="pendudukModalBody">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Map Script -->
    <script>
        // --- 1. Inisialisasi Peta ---
        var map = L.map("map").setView([-8.3147292, 123.1539917], 13);

        // Map Panes untuk mengatur urutan susunan layer (z-index)
        map.createPane('jumlah_penduduk');
        map.getPane('jumlah_penduduk').style.zIndex = 300;

        map.createPane('jalan');
        map.getPane('jalan').style.zIndex = 400;

        // --- 2. Mendefinisikan Pilihan Basemap ---
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });

        osm.addTo(map);

        // --- 3. GeoJSON Point (Toponimi) Menggunakan Bootstrap Icons berdasarkan NAMA_UNSUR ---
        var toponimi_geojson = L.geoJSON(null, {
            pointToLayer: function (feature, latlng) {
                var namaUnsur = feature.properties.NAMA_UNSUR || "Lainnya";
                var unsurLower = namaUnsur.toLowerCase();

                var biIcon = "bi-geo-alt-fill";
                var bgColor = "#0d6efd"; // Default Biru

                if (unsurLower.includes("gunung")) {
                    biIcon = "bi-triangle-fill";
                    bgColor = "#b02a37"; // Merah
                } else if (unsurLower.includes("tanjung")) {
                    biIcon = "bi-flag-fill";
                    bgColor = "#0a58ca"; // Biru Tua
                } else if (unsurLower.includes("teluk")) {
                    biIcon = "bi-water";
                    bgColor = "#198754"; // Hijau/Teal
                } else if (unsurLower.includes("pemukiman") || unsurLower.includes("permukiman")) {
                    biIcon = "bi-house-fill";
                    bgColor = "#6f42c1"; // Ungu
                }

                var bootstrapIcon = L.divIcon({
                    className: 'custom-bootstrap-marker',
                    html: `<div style="background-color: ${bgColor}; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.3); border: 2px solid white;">
                             <i class="bi ${biIcon}" style="font-size: 14px;"></i>
                           </div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16],
                    popupAnchor: [0, -16],
                    tooltipAnchor: [16, 0]
                });

                return L.marker(latlng, { icon: bootstrapIcon });
            },
            onEachFeature: function (feature, layer) {
                var imageTag = feature.properties.image ? `<img src="images/${feature.properties.image}" alt="Gambar Toponimi" width="200" style="margin-top:5px;">` : '';

                var popup_content = `
                    <b>Nama:</b> ${feature.properties.TOPONIMI} <br>
                    <b>Kategori:</b> ${feature.properties.NAMA_UNSUR || "-"} <br>
                    <b>Koordinat:</b> ${feature.geometry.coordinates[1]}, ${feature.geometry.coordinates[0]} <br>
                    ${imageTag}
                `;
                layer.bindPopup(popup_content);
                layer.bindTooltip(feature.properties.TOPONIMI, {
                    direction: "left",
                    sticky: true,
                });
            },
        });

        $.getJSON("geojson/toponimi_geojson.geojson", function (data) {
            toponimi_geojson.addData(data);
            map.addLayer(toponimi_geojson);
            updateSearchDatalist();
        });

        // --- 4. GeoJSON Polyline (Jalan) ---
        var jalan = L.geoJSON(null, {
            pane: "jalan",
            style: function (feature) {
                var namaUnsur = feature.properties.NAMA_UNSUR;

                if (namaUnsur === "Jalan Provinsi" || namaUnsur === "Propinsi") {
                    return {
                        pane: "jalan",
                        color: "red",
                        opacity: 1,
                        weight: 3,
                    };
                } else if (namaUnsur === "Jalan Kabupaten" || namaUnsur === "Kabupaten") {
                    return {
                        pane: "jalan",
                        color: "red",
                        opacity: 1,
                        weight: 1.5,
                        dashArray: "10, 10"
                    };
                } else {
                    return {
                        pane: "jalan",
                        color: "red",
                        opacity: 1,
                        weight: 0.5,
                        dashArray: "4, 4"
                    };
                }
            },
            onEachFeature: function (feature, layer) {
                var namaUnsur = feature.properties.NAMA_UNSUR || feature.properties.fungsi || "Jalan Lain";

                var popup_content = `
                    <b>Jenis Jalan:</b> ${namaUnsur} <br>
                    <b>Panjang:</b> ${feature.properties.panjang_km || 0} km
                `;
                layer.bindPopup(popup_content);
                layer.bindTooltip(namaUnsur, {
                    direction: "auto",
                    sticky: true,
                });
            },
        });

        $.getJSON("geojson/jalan.geojson", function (data) {
            jalan.addData(data);
            map.addLayer(jalan);
            updateSearchDatalist();
        });

        // --- 5. GeoJSON Polygon (Jumlah Penduduk) ---
        var jumlah_penduduk = L.geoJSON(null, {
            pane: "jumlah_penduduk",
            style: function (feature) {
                var p = feature.properties.Penduduk || 0;
                if (p <= 12000) {
                    return {
                        pane: "jumlah_penduduk",
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#ffffcc' // Kuning muda sesuai gambar
                    };
                } else if (p > 12000 && p <= 24000) {
                    return {
                        pane: "jumlah_penduduk",
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#fd8d3c' // Oranye sesuai gambar
                    };
                } else {
                    return {
                        pane: "jumlah_penduduk",
                        opacity: 1,
                        color: 'black',
                        weight: 1.0,
                        fillOpacity: 0.7,
                        fillColor: '#bd0026' // Merah tua sesuai gambar
                    };
                }
            },
            onEachFeature: function (feature, layer) {
                var namaKecamatan = feature.properties.Kecamatan || feature.properties.KECAMATAN || feature.properties.kecamatan || feature.properties.WADMKC || "Data tidak ditemukan";
                var jumlahPenduduk = feature.properties.Penduduk || feature.properties.jumlah_penduduk || 0;
                var namaDesa = feature.properties.Desa || feature.properties.DESA || feature.properties.desa || feature.properties.NAMOBJ || namaKecamatan;
                var kabupaten = feature.properties.WADMKK || "Flores Timur";

                layer.on({
                    click: function (e) {
                        var modalTitle = `<i class="bi bi-people-fill"></i> Data Penduduk - ${namaDesa}`;
                        var modalBody = `
                            <table class="table table-striped table-bordered mb-0">
                                <tr>
                                    <th scope="row">Desa / Kelurahan</th>
                                    <td>${namaDesa}</td>
                                </tr>
                                <tr>
                                    <th scope="row">Kecamatan</th>
                                    <td>${namaKecamatan}</td>
                                </tr>
                                <tr>
                                    <th scope="row">Kabupaten</th>
                                    <td>${kabupaten}</td>
                                </tr>
                                <tr>
                                    <th scope="row">Jumlah Penduduk</th>
                                    <td><b>${Number(jumlahPenduduk).toLocaleString('id-ID')}</b> jiwa</td>
                                </tr>
                            </table>
                        `;
                        document.getElementById("pendudukModalLabel").innerHTML = modalTitle;
                        document.getElementById("pendudukModalBody").innerHTML = modalBody;
                        bootstrap.Modal.getOrCreateInstance(document.getElementById("pendudukModal")).show();
                    }
                });

                layer.bindTooltip(namaDesa, {
                    direction: "auto",
                    sticky: true,
                });
            }
        });

        $.getJSON("geojson/jumlah_penduduk.geojson", function (data) {
            jumlah_penduduk.addData(data);
            map.addLayer(jumlah_penduduk);
            updateSearchDatalist();
        });

        // --- 6. Control Layer dengan Legenda yang Disesuaikan ---
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
        };

        var label_toponimi = 'Toponimi<br>' +
            '<div style="margin-left: 20px; font-size: 11px; line-height: 18px; margin-top: 3px;">' +
            '<div><i class="bi bi-triangle-fill" style="color:#b02a37; margin-right:5px;"></i> Gunung</div>' +
            '<div><i class="bi bi-flag-fill" style="color:#0a58ca; margin-right:5px;"></i> Tanjung</div>' +
            '<div><i class="bi bi-water" style="color:#198754; margin-right:5px;"></i> Teluk</div>' +
            '<div><i class="bi bi-house-fill" style="color:#6f42c1; margin-right:5px;"></i> Pemukiman</div>' +
            '</div>';

        var label_jalan = 'Jalan<br>' +
            '<div style="margin-left: 20px; font-size: 11px; line-height: 18px; margin-top: 3px;">' +
            '<div><span style="display: inline-block; width: 16px; height: 3px; background-color: red; vertical-align: middle; margin-right: 5px;"></span> Propinsi</div>' +
            '<div><span style="display: inline-block; width: 16px; border-top: 2px dashed red; vertical-align: middle; margin-right: 5px;"></span> Kabupaten</div>' +
            '<div><span style="display: inline-block; width: 16px; border-top: 1px dashed red; vertical-align: middle; margin-right: 5px;"></span> Lain</div>' +
            '</div>';

        var label_penduduk = 'Jumlah Penduduk<br>' +
            '<div style="margin-left: 20px; font-size: 11px; line-height: 18px; margin-top: 3px;">' +
            '<div><span style="display: inline-block; width: 12px; height: 12px; background-color: #ffffcc; border: 1px solid black; vertical-align: middle; margin-right: 5px;"></span> &le; 12.000 jiwa</div>' +
            '<div><span style="display: inline-block; width: 12px; height: 12px; background-color: #fd8d3c; border: 1px solid black; vertical-align: middle; margin-right: 5px;"></span> 12.001 - 24.000 jiwa</div>' +
            '<div><span style="display: inline-block; width: 12px; height: 12px; background-color: #bd0026; border: 1px solid black; vertical-align: middle; margin-right: 5px;"></span> &gt; 24.000 jiwa</div>' +
            '</div>';

        var overlayMaps = {
            [label_toponimi]: toponimi_geojson,
            [label_jalan]: jalan,
            [label_penduduk]: jumlah_penduduk,
        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);

        // --- 7. Scale Bar ---
        L.control.scale({
            position: "bottomleft",
            maxWidth: 150
        }).addTo(map);

        // --- 8. Fitur Pencarian ---
        function updateSearchDatalist() {
            var datalist = document.getElementById("searchDatalist");
            if (!datalist) return;
            datalist.innerHTML = "";
            var items = new Set();

            toponimi_geojson.eachLayer(function (l) {
                if (l.feature && l.feature.properties && l.feature.properties.TOPONIMI) {
                    items.add(l.feature.properties.TOPONIMI);
                }
            });

            jumlah_penduduk.eachLayer(function (l) {
                if (l.feature && l.feature.properties) {
                    var p = l.feature.properties;
                    var desa = p.Desa || p.DESA || p.desa || p.NAMOBJ;
                    var kec = p.Kecamatan || p.KECAMATAN || p.kecamatan || p.WADMKC;
                    if (desa) items.add(desa);
                    if (kec) items.add(kec);
                }
            });

            jalan.eachLayer(function (l) {
                if (l.feature && l.feature.properties) {
                    var jenisJalan = l.feature.properties.NAMA_UNSUR || l.feature.properties.fungsi;
                    if (jenisJalan) items.add(jenisJalan);
                }
            });

            items.forEach(function (val) {
                var opt = document.createElement("option");
                opt.value = val;
                datalist.appendChild(opt);
            });
        }

        function doSearch(query) {
            if (!query) return;
            var q = query.trim().toLowerCase();
            var found = false;

            toponimi_geojson.eachLayer(function (layer) {
                if (found) return;
                var props = layer.feature && layer.feature.properties ? layer.feature.properties : {};
                var name = (props.TOPONIMI || "").toLowerCase();
                if (name.includes(q)) {
                    if (!map.hasLayer(toponimi_geojson)) {
                        map.addLayer(toponimi_geojson);
                    }
                    map.setView(layer.getLatLng(), 15);
                    layer.openPopup();
                    found = true;
                }
            });

            if (!found) {
                jumlah_penduduk.eachLayer(function (layer) {
                    if (found) return;
                    var props = layer.feature && layer.feature.properties ? layer.feature.properties : {};
                    var desa = (props.Desa || props.DESA || props.desa || props.NAMOBJ || "").toLowerCase();
                    var kec = (props.Kecamatan || props.KECAMATAN || props.kecamatan || props.WADMKC || "").toLowerCase();
                    if (desa.includes(q) || kec.includes(q)) {
                        if (!map.hasLayer(jumlah_penduduk)) {
                            map.addLayer(jumlah_penduduk);
                        }
                        map.fitBounds(layer.getBounds());
                        layer.fire('click');
                        found = true;
                    }
                });
            }

            if (!found) {
                jalan.eachLayer(function (layer) {
                    if (found) return;
                    var props = layer.feature && layer.feature.properties ? layer.feature.properties : {};
                    var jenisJalan = (props.NAMA_UNSUR || props.fungsi || "").toLowerCase();
                    if (jenisJalan.includes(q)) {
                        if (!map.hasLayer(jalan)) {
                            map.addLayer(jalan);
                        }
                        map.fitBounds(layer.getBounds());
                        layer.openPopup();
                        found = true;
                    }
                });
            }

            if (!found) {
                alert("Data \"" + query + "\" tidak ditemukan pada layer peta.");
            }
        }

        var searchForm = document.getElementById("searchForm");
        if (searchForm) {
            searchForm.addEventListener("submit", function (e) {
                e.preventDefault();
                var searchInput = document.getElementById("searchInput");
                if (searchInput) {
                    doSearch(searchInput.value);
                }
            });
        }
    </script>
</body>

</html>
